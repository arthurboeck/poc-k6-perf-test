name: CI - Build e Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar testes de performance (k6 oficial via Docker)
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            -w /src \
            grafana/k6:latest \
            run --summary-export summary.json --out json=results.json main.js || true

      - name: Aneximar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-teste
          path: |
            results.json
            summary.json

  reports:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar relatórios de teste
        uses: actions/download-artifact@v4
        with:
          name: relatorios-teste
          path: relatorios/

      - name: Listar relatórios disponíveis
        run: |
          echo "Relatórios gerados:"
          ls -la relatorios/